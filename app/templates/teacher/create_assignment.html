<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ '编辑作业' if assignment else '创建新作业' }} - 智慧教学平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --warning: #d97706;
            --danger: #dc2626;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f5f9;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            background: var(--bg-primary);
            display: flex;
            line-height: 1.5;
        }

        .sidebar {
            width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 0 8px 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            font-weight: bold;
        }

        .logo-text {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .sidebar-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            padding-left: 46px;
        }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .nav-icon {
            font-size: 18px;
            color: white;
            font-weight: bold;
            width: 20px;
            text-align: center;
        }

        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 32px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .welcome {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .welcome-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            color: white;
            font-weight: bold;
            font-weight: 600;
        }

        .card {
            background: var(--bg-secondary);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 28px;
            max-width: 700px;
        }

        .card-header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-size: 18px;
            color: white;
            font-weight: bold;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s ease;
            outline: none;
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .form-group textarea {
            height: 140px;
            resize: vertical;
            min-height: 100px;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: var(--text-secondary);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .error-message {
            background: rgba(220, 38, 38, 0.1);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .success-message {
            background: rgba(22, 163, 74, 0.1);
            color: var(--success);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        @media (max-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                z-index: 100;
                transition: transform 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .card {
                padding: 20px;
            }

            .form-actions {
                flex-direction: column-reverse;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">AI</div>
                <div class="logo-text">CodeMate</div>
            </div>
            <div class="sidebar-subtitle">教师端</div>
        </div>

        <nav class="sidebar-nav">
            <a href="/teacher" class="nav-item">
                <span>仪表盘</span>
            </a>
            <a href="/teacher/classes" class="nav-item">
                <span>班级管理</span>
            </a>
            <a href="/teacher/assignments" class="nav-item active">
                <span>作业管理</span>
            </a>
            <a href="/teacher/students" class="nav-item">
                <span>学生管理</span>
            </a>
            <a href="/teacher/submissions" class="nav-item">
                <span>作业提交</span>
            </a>
            <a href="/profile" class="nav-item">
                <span>个人资料</span>
            </a>
            <a href="/logout" class="nav-item" style="margin-top: auto;">
                <span>退出登录</span>
            </a>
        </nav>
    </div>

    <main class="main-content">
        <div class="header">
            <div class="welcome">
                <h1 class="welcome-title">{{ '编辑作业' if assignment else '创建新作业' }}</h1>
                <p class="welcome-subtitle">{{ '修改作业信息' if assignment else '设置作业标题、描述和截止时间' }}</p>
            </div>
            <div class="user-info">
                <div class="user-avatar">{{ display_name[0] }}</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3 class="card-title">{{ '编辑作业' if assignment else '创建新作业' }}</h3>
            </div>

            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}

            {% if success %}
            <div class="success-message">{{ success }}</div>
            {% endif %}

            <form method="post">
                <div class="form-group">
                    <label>作业标题 *</label>
                    <input type="text" name="title" required 
                           value="{{ assignment.title if assignment else '' }}"
                           placeholder="请输入作业标题">
                </div>

                <div class="form-group">
                    <label>作业描述</label>
                    <textarea name="description" 
                              placeholder="请描述作业要求...">{{ assignment.description if assignment else '' }}</textarea>
                </div>

                <div class="form-group">
                    <label>截止时间</label>
                    <input type="datetime-local" name="deadline"
                           value="{{ assignment.get_deadline_datetime_str() if assignment else '' }}">
                </div>

                <div class="form-group">
                    <label>所属班级</label>
                    <select name="class_id">
                        <option value="">所有班级</option>
                        {% for cls in classes %}
                        <option value="{{ cls.id }}" {% if assignment and assignment.class_id == cls.id %}selected{% endif %}>{{ cls.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="location.href='/teacher/assignments'">
                        取消
                    </button>
                    <button type="submit" class="btn btn-primary">
                        {{ '保存修改' if assignment else '创建作业' }}
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
