<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 智慧教学平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            background: var(--bg-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            line-height: 1.5;
        }

        .register-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 64px;
            max-width: 1000px;
            width: 100%;
            align-items: start;
        }

        .brand-section {
            animation: fadeInLeft 0.6s ease-out;
            position: sticky;
            top: 24px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .brand-title {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .brand-description {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .register-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 40px;
            box-shadow: var(--shadow-lg);
            animation: fadeInRight 0.6s ease-out;
        }

        .register-header {
            margin-bottom: 32px;
        }

        .register-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .register-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s ease;
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .form-input::placeholder {
            color: #94a3b8;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .role-option {
            position: relative;
            cursor: pointer;
        }

        .role-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .role-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 20px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            transition: all 0.2s ease;
            background: var(--bg-secondary);
        }

        .role-icon {
            font-size: 32px;
        }

        .role-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .role-option input:checked + .role-label {
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.05);
        }

        .role-option:hover .role-label {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        .footer-text {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
        }

        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 768px) {
            .register-wrapper {
                grid-template-columns: 1fr;
                gap: 32px;
            }

            .brand-section {
                text-align: center;
                position: static;
            }

            .brand-logo {
                justify-content: center;
            }

            .brand-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="register-wrapper">
        <div class="brand-section">
            <div class="brand-logo">
                <div class="brand-icon">AI</div>
                <div class="brand-name">智慧教学平台</div>
            </div>
            <h1 class="brand-title">开始你的<br>编程学习之旅</h1>
            <p class="brand-description">加入我们的社区，享受AI驱动的学习体验，与教师和同学一起成长。</p>
        </div>

        <div class="register-card">
            <div class="register-header">
                <h2 class="register-title">创建账号</h2>
                <p class="register-subtitle">填写以下信息完成注册</p>
            </div>

            <form method="post">
                <div class="form-group">
                    <label class="form-label" for="username">用户名</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="请输入用户名（用于登录）" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="display_name">姓名/昵称</label>
                    <input type="text" id="display_name" name="display_name" class="form-input" placeholder="请输入姓名或昵称（用于显示）" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">密码</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label class="form-label">选择角色</label>
                    <div class="role-selector">
                        <label class="role-option">
                            <input type="radio" name="role" value="student" checked>
                            <div class="role-label">
                                <span class="role-name">学生</span>
                            </div>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="teacher">
                            <div class="role-label">
                                <span class="role-name">教师</span>
                            </div>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">注册</button>
            </form>

            <div class="divider">
                <div class="divider-line"></div>
                <div class="divider-text">已有账号？</div>
                <div class="divider-line"></div>
            </div>

            <p class="footer-text">
                <a href="/login" class="link">立即登录</a>
            </p>
        </div>
    </div>
</body>
</html>
